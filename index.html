<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plickers Web App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">

  <div class="max-w-2xl mx-auto">
    <!-- Header Navigation -->
    <div class="bg-blue-600 text-white p-4 rounded-t-lg flex justify-between items-center shadow">
      <h1 class="text-xl font-bold">Plickers Web App</h1>
      <div class="space-x-2">
        <button onclick="switchTab('scanner')" class="px-3 py-1 bg-blue-700 hover:bg-blue-800 rounded text-sm font-semibold">Scanner</button>
        <button onclick="switchTab('bulk')" class="px-3 py-1 bg-blue-700 hover:bg-blue-800 rounded text-sm font-semibold">Bulk</button>
      </div>
    </div>

    <!-- Scanner Tab -->
    <div id="tab-scanner" class="bg-white p-4 rounded-b-lg shadow-md mb-4">
      <h2 class="text-lg font-bold mb-2 text-gray-800">Live Classroom Scanner</h2>
      
      <!-- Question Selector -->
      <label class="block text-xs font-semibold text-gray-600 mb-1">Select Active Question:</label>
      <select id="questionSelect" onchange="onQuestionChange()" class="w-full p-2 border border-gray-300 rounded mb-4 text-sm bg-white">
        <option value="">Loading questions...</option>
      </select>

      <!-- Options Display Box -->
      <div id="optionsContainer" class="grid grid-cols-2 gap-2 mb-4">
        <div id="opt-A" class="p-2 border rounded bg-gray-50 text-xs font-medium text-gray-700">A: -</div>
        <div id="opt-B" class="p-2 border rounded bg-gray-50 text-xs font-medium text-gray-700">B: -</div>
        <div id="opt-C" class="p-2 border rounded bg-gray-50 text-xs font-medium text-gray-700">C: -</div>
        <div id="opt-D" class="p-2 border rounded bg-gray-50 text-xs font-medium text-gray-700">D: -</div>
      </div>

      <!-- Camera Controls -->
      <div class="flex gap-2 mb-4">
        <button onclick="startScanner()" class="flex-1 bg-emerald-600 text-white py-2 rounded-md font-semibold text-sm hover:bg-emerald-700">Start Camera</button>
        <button onclick="stopScanner()" class="flex-1 bg-red-600 text-white py-2 rounded-md font-semibold text-sm hover:bg-red-700">Stop Camera</button>
      </div>

      <!-- Video Feed Container -->
      <div id="reader" class="w-full bg-black rounded-lg overflow-hidden min-h-[250px]"></div>

      <!-- Live Sync Results Log -->
      <div class="mt-4 p-3 bg-gray-50 border rounded-md">
        <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Live Response Log</h3>
        <ul id="logList" class="text-xs space-y-1 text-gray-700 max-h-40 overflow-y-auto">
          <li class="text-gray-400 italic">No responses scanned yet for this question.</li>
        </ul>
      </div>
    </div>

    <!-- Bulk Tab -->
    <div id="tab-bulk" class="bg-white p-4 rounded-b-lg shadow-md mb-4 hidden">
      <h2 class="text-md font-semibold mb-2 text-gray-700">Add Bulk Questions</h2>
      <textarea id="bulkInput" rows="8" class="w-full p-2 border border-gray-300 rounded-md font-mono text-xs" placeholder="Q1 | She ___ to school. | go | goes | is go | gone | B"></textarea>
      <button onclick="submitBulk()" class="mt-3 w-full bg-blue-600 text-white py-2 rounded-md font-semibold text-xs hover:bg-blue-700">Upload Bulk Questions</button>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxqydSfMVkE3p2WAl5Vu5daGGFPRF4jSShI5rOle6gcTwLLW2PPx777qm9yUZKfr1EyBw/exec";

    let appQuestions = [];
    let currentActiveQuestion = "";
    let html5QrCode = null;
    let isUserSelecting = false;

    window.onload = function() {
      fetchData();
      // Auto-sync polling every 2 seconds
      setInterval(syncState, 2000);
    };

    function switchTab(tab) {
      document.getElementById('tab-scanner').classList.toggle('hidden', tab !== 'scanner');
      document.getElementById('tab-bulk').classList.toggle('hidden', tab !== 'bulk');
    }

    // 1. Initial Load
    function fetchData() {
      fetch(API_URL)
        .then(res => res.json())
        .then(data => {
          appQuestions = data.questions || [];
          renderQuestionDropdown();
          if (data.activeQuestion) {
            updateActiveQuestionUI(data.activeQuestion);
          }
          renderLogs(data.logs || []);
        })
        .catch(err => console.error("Error loading data:", err));
    }

    // 2. Real-Time Sync Polling Loop
    function syncState() {
      if (isUserSelecting) return;

      fetch(API_URL)
        .then(res => res.json())
        .then(data => {
          appQuestions = data.questions || [];
          renderQuestionDropdown();
          if (data.activeQuestion && data.activeQuestion !== currentActiveQuestion) {
            updateActiveQuestionUI(data.activeQuestion);
          }
          renderLogs(data.logs || []);
        })
        .catch(err => console.error("Sync error:", err));
    }

    function renderQuestionDropdown() {
      const select = document.getElementById('questionSelect');
      const prevVal = select.value;
      select.innerHTML = '';

      if (appQuestions.length === 0) {
        select.innerHTML = '<option value="">No questions found. Add via Bulk tab.</option>';
        return;
      }

      appQuestions.forEach(q => {
        let opt = document.createElement('option');
        opt.value = q.id;
        opt.text = `Q${q.id}: ${q.text}`;
        select.appendChild(opt);
      });

      if (prevVal) select.value = prevVal;
    }

    // 3. Question Change Sync Trigger
    function onQuestionChange() {
      const selectedId = document.getElementById('questionSelect').value;
      if (!selectedId) return;

      isUserSelecting = true;
      updateActiveQuestionUI(selectedId);

      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'setActiveQuestion', questionId: selectedId })
      }).finally(() => {
        isUserSelecting = false;
      });
    }

    // 4. Render Active Question & Options A, B, C, D
    function updateActiveQuestionUI(qId) {
      currentActiveQuestion = qId;
      document.getElementById('questionSelect').value = qId;

      const q = appQuestions.find(item => String(item.id) === String(qId));
      if (q && q.options) {
        document.getElementById('opt-A').innerHTML = `<b>A:</b> ${q.options.A || '-'}`;
        document.getElementById('opt-B').innerHTML = `<b>B:</b> ${q.options.B || '-'}`;
        document.getElementById('opt-C').innerHTML = `<b>C:</b> ${q.options.C || '-'}`;
        document.getElementById('opt-D').innerHTML = `<b>D:</b> ${q.options.D || '-'}`;
      }
    }

    function renderLogs(logs) {
      const list = document.getElementById('logList');
      if (!logs || logs.length === 0) {
        list.innerHTML = '<li class="text-gray-400 italic">No responses scanned yet for this question.</li>';
        return;
      }

      list.innerHTML = logs.map(l => 
        `<li class="p-1 bg-white border rounded flex justify-between">
          <span>Card #${l.cardId} (${l.studentName || 'Student'})</span>
          <span class="font-bold text-blue-600">Answer: ${l.answer}</span>
        </li>`
      ).reverse().join('');
    }

    // 5. Camera Scanner Logic
    async function startScanner() {
      if (html5QrCode) await stopScanner();
      html5QrCode = new Html5Qrcode("reader");

      try {
        let devices = await Html5Qrcode.getCameras();
        if (!devices || devices.length === 0) {
          alert("No camera found.");
          return;
        }

        let cameraId = devices.length > 1 ? devices[devices.length - 1].id : devices[0].id;

        await html5QrCode.start(
          cameraId,
          { fps: 10, qrbox: { width: 200, height: 200 } },
          onScanSuccess,
          () => {}
        );
      } catch (err) {
        alert("Scanner start failed: " + err);
      }
    }

    async function stopScanner() {
      if (html5QrCode) {
        try {
          await html5QrCode.stop();
          html5QrCode.clear();
        } catch(e) {}
      }
    }

    function onScanSuccess(decodedText) {
      const qId = document.getElementById('questionSelect').value;
      if (!qId) return;

      // Extract Card ID & Answer Option (e.g., P01-A)
      let cardId = decodedText;
      let answer = "A";
      if (decodedText.includes("-")) {
        let parts = decodedText.split("-");
        cardId = parts[0];
        answer = parts[1];
      }

      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          questionId: qId,
          cardId: cardId,
          studentName: "Student " + cardId,
          answer: answer
        })
      }).then(() => syncState());
    }

    // 6. Bulk Questions Parser
    function submitBulk() {
      const raw = document.getElementById('bulkInput').value.trim();
      if (!raw) return;

      const lines = raw.split('\n');
      const parsedQuestions = [];

      lines.forEach((line, idx) => {
        const parts = line.split('|').map(s => s.trim());
        if (parts.length >= 7) {
          parsedQuestions.push({
            id: String(idx + 1),
            text: parts[1],
            options: { A: parts[2], B: parts[3], C: parts[4], D: parts[5] },
            correct: parts[6]
          });
        }
      });

      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'bulkQuestions', questions: parsedQuestions })
      })
      .then(res => res.json())
      .then(() => {
        alert("Questions uploaded!");
        switchTab('scanner');
        fetchData();
      });
    }
  </script>
</body>
</html>
